name: kredi_plus
publish_to: "none"
description: Kredi+ Mobile Flutter para beneficiarios.
version: 2.2.23+48
environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ">=5.7.0 <6.0.0"
  flutter_secure_storage: ">=9.2.0 <11.0.0"
  local_auth: ">=3.0.2 <4.0.0"
  shared_preferences: ">=2.3.0 <3.0.0"
  cached_network_image: ">=3.4.0 <4.0.0"
  image_picker: ">=1.1.0 <2.0.0"
  mobile_scanner: ">=6.0.0 <8.0.0"
  intl: ">=0.19.0 <0.21.0"
  crypto: ">=3.0.6 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_launcher_icons: ">=0.14.0 <1.0.0"
  flutter_native_splash: ">=2.4.0 <3.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/brand/kredi_launcher.png"
  image_path_ios: "assets/brand/kredi_launcher.png"
  remove_alpha_ios: true

flutter_native_splash:
  android: false
  ios: true
  web: false
  color: "#FFFBF7"
  image: assets/brand/kredi_wordmark.png
